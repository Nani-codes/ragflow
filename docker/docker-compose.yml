# Coolify-ready RAGFlow (CPU + Elasticsearch)
# - No custom networks (Coolify provides one)
# - No host port publishes (use Coolify domain → port 80)
# - Flat services (no compose profiles / include)
# - Defaults match upstream docker/.env (change secrets in Coolify for production)
# Upstream original saved as docker-compose.upstream.yml
#
# IMPORTANT: Do NOT put MYSQL_PASSWORD into the mysql service env unless
# MYSQL_USER is also set — the official MySQL image exits if MYSQL_PASSWORD
# is set alone.

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.27.2}
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DOC_ENGINE: ${DOC_ENGINE:-elasticsearch}
      DB_TYPE: ${DB_TYPE:-mysql}
      DEVICE: ${DEVICE:-cpu}
      TZ: ${TZ:-UTC}
      RAGFLOW_HOST: ${RAGFLOW_HOST:-0.0.0.0}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_MAX_PACKET: ${MYSQL_MAX_PACKET:-1073741824}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PREFIX_PATH: ${MINIO_PREFIX_PATH:-}
      ES_HOST: ${ES_HOST:-es01}
      ES_PORT: ${ES_PORT:-9200}
      ES_USER: ${ES_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-0}
      ENABLE_REGISTER: ${ENABLE_REGISTER:-false}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-false}
      DOC_BULK_SIZE: ${DOC_BULK_SIZE:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      THREAD_POOL_MAX_WORKERS: ${THREAD_POOL_MAX_WORKERS:-128}
      USE_DOCLING: ${USE_DOCLING:-false}
    volumes:
      - ragflow_logs:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
      - ./entrypoint.sh:/ragflow/entrypoint.sh:ro
    expose:
      - "80"
      - "9380"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  es01:
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    restart: unless-stopped

  mysql:
    image: mysql:8.0.40
    environment:
      # Only official MySQL vars — never set MYSQL_PASSWORD without MYSQL_USER
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-rag_flow}
    command:
      - --max_connections=1000
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_PASSWORD:-infini_rag_flow}",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-infini_rag_flow}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  ragflow_logs:
  esdata01:
  mysql_data:
  minio_data:
  redis_data:
