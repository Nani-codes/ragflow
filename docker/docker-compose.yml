# Coolify-ready RAGFlow (CPU + Elasticsearch)
# - No custom networks / no host port publishes
# - No bind-mounts of repo files (Coolify turns missing ./file into a directory and breaks)
# - MySQL entrypoint is inline to neutralize Coolify MYSQL_USER=root injection
# - ragflow waits for deps before starting (avoids nginx-up / API-502 when ES is slow)
#
# Coolify UI: Domain → service "ragflow", port 80

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.27.2}
    depends_on:
      - mysql
      - es01
      - redis
      - minio
    # Wait for deps, then hand off to the image entrypoint.
    # Without this, nginx comes up immediately while api/ragflow_server.py dies
    # after ~120s waiting for Elasticsearch → persistent /api/v1 502.
    entrypoint:
      - /bin/bash
      - -ec
      - |
          set -e
          # Coolify injects shared env into every container and can blank/override
          # service hostnames. Force in-compose DNS names after env injection.
          export MYSQL_HOST=mysql
          export MYSQL_PORT=3306
          export REDIS_HOST=redis
          export REDIS_PORT=6379
          export MINIO_HOST=minio
          export MINIO_PORT=9000
          export ES_HOST=es01
          export ES_PORT=9200
          export DOC_ENGINE=elasticsearch
          export DB_TYPE=mysql
          if [ "$${MYSQL_USER:-}" = "root" ] || [ -z "$${MYSQL_USER:-}" ]; then
            echo "coolify-ragflow: rewriting MYSQL_USER -> rag_flow"
            export MYSQL_USER=rag_flow
          fi
          if [ -z "$${MYSQL_DBNAME:-}" ]; then
            export MYSQL_DBNAME=rag_flow
          fi
          wait_tcp() {
            local host="$$1" port="$$2" name="$$3"
            echo "coolify-ragflow: waiting for $$name ($$host:$$port)..."
            while true; do
              if (echo >/dev/tcp/$$host/$$port) >/dev/null 2>&1; then
                echo "coolify-ragflow: $$name is reachable"
                return 0
              fi
              sleep 2
            done
          }
          wait_es() {
            local auth="elastic:$${ELASTIC_PASSWORD:-infini_rag_flow}"
            echo "coolify-ragflow: waiting for Elasticsearch health (will not start API until ready)..."
            while true; do
              # Prefer authenticated health; fall back to unauthenticated (security disabled).
              if curl -fsS -u "$$auth" "http://es01:9200/_cluster/health" >/dev/null 2>&1 \
                || curl -fsS "http://es01:9200/_cluster/health" >/dev/null 2>&1; then
                echo "coolify-ragflow: Elasticsearch is healthy"
                return 0
              fi
              sleep 5
            done
          }
          wait_tcp mysql 3306 mysql
          wait_tcp redis 6379 redis
          wait_tcp minio 9000 minio
          wait_tcp es01 9200 elasticsearch-tcp
          wait_es
          cd /ragflow
          # Defer heavy workers until the API is proven healthy on Coolify
          exec ./entrypoint.sh --disable-taskexecutor --disable-datasync
    environment:
      DOC_ENGINE: ${DOC_ENGINE:-elasticsearch}
      DB_TYPE: ${DB_TYPE:-mysql}
      DEVICE: ${DEVICE:-cpu}
      TZ: ${TZ:-UTC}
      RAGFLOW_HOST: ${RAGFLOW_HOST:-0.0.0.0}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-rag_flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_MAX_PACKET: ${MYSQL_MAX_PACKET:-1073741824}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PREFIX_PATH: ${MINIO_PREFIX_PATH:-}
      ES_HOST: ${ES_HOST:-es01}
      ES_PORT: ${ES_PORT:-9200}
      ES_USER: ${ES_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-0}
      ENABLE_REGISTER: ${ENABLE_REGISTER:-false}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-false}
      DOC_BULK_SIZE: ${DOC_BULK_SIZE:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      THREAD_POOL_MAX_WORKERS: ${THREAD_POOL_MAX_WORKERS:-128}
      USE_DOCLING: ${USE_DOCLING:-false}
    volumes:
      - ragflow_logs:/ragflow/logs
    expose:
      - "80"
      - "9380"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  es01:
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      # Security off avoids Coolify password/volume mismatch 401s that leave the API dead
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      # Avoid host vm.max_map_count failures common on shared Coolify VMs
      node.store.allow_mmap: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
      # Keep heap modest so ES can boot on a shared Coolify host
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      # New volume name forces a clean ES bootstrap (old esdata01 may have a different elastic password)
      - esdata02:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${MEM_LIMIT:-2147483648}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    restart: unless-stopped

  mysql:
    image: mysql:8.0.40
    entrypoint:
      - /bin/bash
      - -ec
      - |
          ROOT_PW="$${MYSQL_ROOT_PASSWORD:-$${MYSQL_PASSWORD:-infini_rag_flow}}"
          DB_NAME="$${MYSQL_DATABASE:-rag_flow}"
          if [ "$${MYSQL_USER:-}" = "root" ]; then
            echo "coolify-entrypoint: ignoring MYSQL_USER=root"
            APP_USER="rag_flow"
            APP_PW="$$ROOT_PW"
          else
            APP_USER="$${MYSQL_USER:-rag_flow}"
            APP_PW="$${MYSQL_PASSWORD:-$$ROOT_PW}"
          fi
          export MYSQL_ROOT_PASSWORD="$$ROOT_PW"
          export MYSQL_DATABASE="$$DB_NAME"
          export MYSQL_USER="$$APP_USER"
          export MYSQL_PASSWORD="$$APP_PW"
          echo "coolify-entrypoint: mysqld db=$$MYSQL_DATABASE user=$$MYSQL_USER"
          exec docker-entrypoint.sh mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_USER: ${MYSQL_USER:-rag_flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: valkey/valkey:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-infini_rag_flow}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  ragflow_logs:
  esdata02:
  mysql_data:
  minio_data:
  redis_data:
