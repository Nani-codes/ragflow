# Coolify-ready RAGFlow (CPU + Elasticsearch)
# - No custom networks / no host port publishes
# - No bind-mounts of repo files (Coolify turns missing ./file into a directory and breaks)
# - MySQL entrypoint is inline to neutralize Coolify MYSQL_USER=root injection
#
# Coolify UI: Domain → service "ragflow", port 80

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-infiniflow/ragflow:v0.27.2}
    depends_on:
      - mysql
      - es01
      - redis
      - minio
    environment:
      DOC_ENGINE: ${DOC_ENGINE:-elasticsearch}
      DB_TYPE: ${DB_TYPE:-mysql}
      DEVICE: ${DEVICE:-cpu}
      TZ: ${TZ:-UTC}
      RAGFLOW_HOST: ${RAGFLOW_HOST:-0.0.0.0}
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-rag_flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DBNAME: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_MAX_PACKET: ${MYSQL_MAX_PACKET:-1073741824}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USER: ${MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_PREFIX_PATH: ${MINIO_PREFIX_PATH:-}
      ES_HOST: ${ES_HOST:-es01}
      ES_PORT: ${ES_PORT:-9200}
      ES_USER: ${ES_USER:-elastic}
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      REGISTER_ENABLED: ${REGISTER_ENABLED:-0}
      ENABLE_REGISTER: ${ENABLE_REGISTER:-false}
      DISABLE_PASSWORD_LOGIN: ${DISABLE_PASSWORD_LOGIN:-false}
      DOC_BULK_SIZE: ${DOC_BULK_SIZE:-4}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      THREAD_POOL_MAX_WORKERS: ${THREAD_POOL_MAX_WORKERS:-128}
      USE_DOCLING: ${USE_DOCLING:-false}
    volumes:
      - ragflow_logs:/ragflow/logs
    expose:
      - "80"
      - "9380"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  es01:
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    environment:
      node.name: es01
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      bootstrap.memory_lock: "false"
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${MEM_LIMIT:-8073741824}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  mysql:
    image: mysql:8.0.40
    entrypoint:
      - /bin/bash
      - -ec
      - |
          ROOT_PW="$${MYSQL_ROOT_PASSWORD:-$${MYSQL_PASSWORD:-infini_rag_flow}}"
          DB_NAME="$${MYSQL_DATABASE:-rag_flow}"
          if [ "$${MYSQL_USER:-}" = "root" ]; then
            echo "coolify-entrypoint: ignoring MYSQL_USER=root"
            APP_USER="rag_flow"
            APP_PW="$$ROOT_PW"
          else
            APP_USER="$${MYSQL_USER:-rag_flow}"
            APP_PW="$${MYSQL_PASSWORD:-$$ROOT_PW}"
          fi
          export MYSQL_ROOT_PASSWORD="$$ROOT_PW"
          export MYSQL_DATABASE="$$DB_NAME"
          export MYSQL_USER="$$APP_USER"
          export MYSQL_PASSWORD="$$APP_PW"
          echo "coolify-entrypoint: mysqld db=$$MYSQL_DATABASE user=$$MYSQL_USER"
          exec docker-entrypoint.sh mysqld
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: ${MYSQL_DBNAME:-rag_flow}
      MYSQL_USER: ${MYSQL_USER:-rag_flow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: valkey/valkey:8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-infini_rag_flow}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-infini_rag_flow}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  ragflow_logs:
  esdata01:
  mysql_data:
  minio_data:
  redis_data:
